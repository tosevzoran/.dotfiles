set -g mouse on

set-option -sg escape-time 10

set-option -g automatic-rename-format '#{d:pane_current_path}'
set -g automatic-rename on

set-option -g focus-events

###
### to fix backspace issues run the following
###
### $(brew --prefix)/opt/ncurses/bin/infocmp tmux-256color > ~/tmux-256color.info
### tic -xe tmux-256color ~/tmux-256color.info
###
### more info on https://superuser.com/a/1726134
###

set -s default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB,cstyle"

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g base-index 1              # start indexing windows at 1 instead of 0
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
setw -g mode-keys vi
set -g @sessionx-bind 'o'

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'


set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_pane_border_status 'top'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#{b:pane_current_path}"
set -g @catppuccin_window_current_text "#{b:pane_current_path}"
set -g @catppuccin_directory_text "#{b:pane_current_path}" 

####
# Custom window style to handle transparency with glyphs and multi-line status bar
set -g @catppuccin_window_status_style "custom"

# Default window colors
# Left
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
#set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg="default"]#[bg="default",fg=#{@thm_surface_0}]"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg="default"]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_surface_0},bg="default"]"█"#[bg="default",fg=#{@thm_surface_0}]"
# Right
set -g @catppuccin_window_number_color "#{@thm_lavender}"
set -g @catppuccin_window_right_separator "#[bg="default",fg=#{@thm_lavender}]#[bg="default",fg=#{@thm_lavender}]"

# Current window colors
# Left
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
#set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg="default"]#[bg="default",fg=#{@thm_surface_1}]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_surface_1},bg="default"]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_surface_1},bg="default"]"█"#[bg="default",fg=#{@thm_surface_1}]"
# Right
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_right_separator "#[bg="default",fg=#{@thm_mauve}]#[bg="default",fg=#{@thm_mauve}]"

# Key transparency settings
set -g @catppuccin_status_background "none"
####

set -g status-left ""
set -g status-right 'session: #H ' 

run '~/.config/tmux/plugins/tpm/tpm'
